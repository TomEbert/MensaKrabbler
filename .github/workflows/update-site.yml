name: Update MensaKrabbler

on:
  schedule:
    - cron: "17 1 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "MensaKrabbler.py"
      - "MensaKrabblerWochenZieher.py"
      - "Website/**"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/update-site.yml"
  push:
    branches:
      - main
    paths:
      - "MensaKrabbler.py"
      - "MensaKrabblerWochenZieher.py"
      - "Website/**"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/update-site.yml"

concurrency:
  group: mensakrabbler-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'github-pages-check' || 'github-pages' }}
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Fetch current menus
        run: python MensaKrabblerWochenZieher.py

      - name: Verify generated data
        run: python -m json.tool Website/data/menu.json > /dev/null

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -R Website _site/Website

      - name: Commit generated data
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Website/data/menu.json
          if git diff --cached --quiet; then
            echo "No menu data changes."
          else
            git commit -m "Update menu data"
            if ! git pull --rebase origin main; then
              git rebase --abort
              echo "::warning::Could not rebase generated menu data; skipping the data commit. The prepared Pages artifact is unchanged."
            else
              git push origin HEAD:main
            fi
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/deploy-pages@v5

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Write run summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PAGE_URL: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## MensaKrabbler update"
            echo ""
            echo "| Detail | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`$EVENT_NAME\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "| Result | Validation only - deployment runs from the main branch merge push |"
            elif [[ "$JOB_STATUS" == "success" && -n "$PAGE_URL" ]]; then
              echo "| Result | Pages deployment completed |"
              if [[ -n "$PAGE_URL" ]]; then
                echo "| Site | [$PAGE_URL]($PAGE_URL) |"
              fi
            else
              echo "| Result | Pages deployment did not complete ($JOB_STATUS) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
